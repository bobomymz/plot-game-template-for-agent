<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编写模板 · 结构与操作流程</title>
<style>
  :root {
    --ink: #241c14;
    --muted: #6d6256;
    --red: #9c2b2b;
    --green: #1f4e46;
    --line: #e4d7c3;
    --paper: #fffdf8;
    --bg: #efe6d6;
    --bad: #f8ebe6;
    --ok: #e7f2ec;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font: 16px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  ::selection { background: #f0c9c2; }
  .app { min-height: 100vh; }
  header {
    display: flex; flex-wrap: wrap; gap: 16px 28px;
    align-items: flex-end; justify-content: space-between;
    padding: 22px 28px 12px;
  }
  .eyebrow { margin: 0; letter-spacing: .12em; font-size: 12px; color: var(--red); }
  h1 { margin: 0; font: 700 28px/1.2 "Palatino Linotype", "Songti SC", "SimSun", serif; }
  h2 { margin: 0 0 8px; font: 700 26px/1.3 "Palatino Linotype", "Songti SC", "SimSun", serif; }
  h3 { margin: 0 0 8px; font-size: 16px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: relative; }
  .tools select, .tools input, .ghost, .map-tools input {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  .tools input { width: min(280px, 70vw); }
  .ghost { background: transparent; }
  #hits {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 5;
    width: min(420px, 86vw); background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 12px 30px rgba(60,40,20,.08); padding: 6px;
  }
  #hits button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; }
  #hits button:hover { background: #f6efe4; }
  #hits small { display: block; color: var(--muted); }
  .bar { height: 3px; background: #e4d8c6; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s ease; }
  .shell { display: grid; grid-template-columns: 220px 1fr; gap: 8px; padding: 8px 20px 40px; }
  nav { position: sticky; top: 8px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
  nav button {
    text-align: left; background: transparent; border: 0; border-left: 2px solid transparent;
    padding: 10px 12px; border-radius: 0 10px 10px 0;
  }
  nav button.on { border-left-color: var(--red); background: rgba(255,253,248,.85); font-weight: 650; }
  nav button span { color: var(--muted); font-weight: 400; }
  main { min-width: 0; }
  .sheet {
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 22px 22px 26px; position: relative;
    box-shadow: 0 10px 36px rgba(60,40,20,.05);
  }
  .sheet:before {
    content: ""; position: absolute; left: 10px; top: 16px; bottom: 16px; width: 3px;
    background: var(--red); border-radius: 2px;
  }
  .lead { color: #3d342b; margin-top: 0; }
  .pills { display: flex; gap: 6px; overflow: auto; padding-bottom: 8px; margin: 0 0 14px; }
  .pills button, .filters button, .mini {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 10px; white-space: nowrap;
  }
  .pills button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pills button.done { border-color: var(--green); }
  .pills button.lock { opacity: .45; }
  .board, .map, .phase, .route, .prio { display: grid; gap: 12px; }
  .board { grid-template-columns: repeat(3, 1fr); }
  .map { grid-template-columns: minmax(240px, 340px) 1fr; align-items: start; }
  .phase { grid-template-columns: 180px 1fr; align-items: start; }
  .route { grid-template-columns: 200px repeat(5, 1fr); }
  .prio { grid-template-columns: repeat(3, 1fr); }
  .col, .file-card, .detail, .round, .layer, .path, .rule, .qcard {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff;
  }
  .col { min-height: 180px; }
  .col.over { outline: 2px dashed var(--red); }
  .chip { border: 1px dashed var(--line); border-radius: 10px; padding: 8px; margin: 8px 0; background: #fffdf8; }
  .chip.bad { background: var(--bad); border-style: solid; border-color: #e3b2a8; }
  .chip.ok { background: var(--ok); border-style: solid; border-color: #b7d4c8; }
  .chip p { margin: 0 0 6px; }
  .why { color: var(--red); font-size: 13px; }
  .paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .path { text-align: left; width: 100%; }
  .path.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .path b { display: block; font: 700 18px/1.3 "Palatino Linotype", "Songti SC", serif; margin-bottom: 4px; }
  .muted, small { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .primary, .mini.on {
    background: var(--ink); color: #fff; border: 1px solid var(--ink); border-radius: 10px; padding: 8px 14px;
  }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  .foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 16px; }
  .hint { margin: 8px 0 0; min-height: 1.6em; }
  .layers { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .layer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .layer.lock { opacity: .55; }
  .layer.done { background: var(--ok); }
  .seal {
    width: 92px; height: 92px; border: 3px solid var(--red); color: var(--red); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 800; letter-spacing: .14em;
    transform: rotate(-12deg); margin-left: auto;
  }
  .spine { display: flex; flex-direction: column; gap: 6px; }
  .spine button { text-align: left; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 8px 10px; }
  .spine button.on { background: var(--ink); color: #fff; }
  pre, code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
  pre { background: #241c14; color: #f6efe4; padding: 12px; border-radius: 10px; overflow: auto; }
  .filebtn { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 4px; border-radius: 8px; }
  .filebtn.on { background: #f6efe4; }
  .group { margin-top: 8px; }
  .group > button { background: transparent; border: 0; padding: 4px 0; font-weight: 700; }
  ul { margin: 8px 0; padding-left: 1.2em; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .filters button.on { background: var(--ink); color: #fff; }
  .rule { margin: 8px 0; }
  .rule button.head { width: 100%; text-align: left; background: transparent; border: 0; padding: 0; font-weight: 700; }
  .opt { display: block; width: 100%; text-align: left; margin: 6px 0; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 8px 10px; }
  .opt.pick-ok { background: var(--ok); border-color: #b7d4c8; }
  .opt.pick-bad { background: var(--bad); border-color: #e3b2a8; }
  .peek { display: flex; flex-wrap: wrap; gap: 6px; }
  .peek button { border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 8px 10px; }
  .peek button.on { border-color: var(--red); }
  footer { padding: 0 28px 28px; color: var(--muted); font-size: 13px; }
  @media (max-width: 900px) {
    .shell, .board, .map, .phase, .route, .paths, .prio { grid-template-columns: 1fr; }
    nav { position: static; flex-direction: row; overflow: auto; }
    nav button { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
    nav button.on { border-bottom-color: var(--red); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="eyebrow">剧情游戏编写模板 · 规则以仓库文档为准</p>
      <h1>结构与操作流程</h1>
    </div>
    <div class="tools">
      <label>叙事路径
        <select id="path">
          <option value="">未选</option>
          <option value="fixed">固定分支</option>
          <option value="open">开放世界</option>
          <option value="hybrid">混合型</option>
        </select>
      </label>
      <input id="q" type="search" placeholder="搜索文件、阶段、规则" autocomplete="off" aria-label="搜索">
      <div id="hits" hidden></div>
      <button class="ghost" id="reset" type="button">重置进度</button>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  <div class="shell">
    <nav aria-label="页面">
      <button type="button" data-view="walk">走一遍 <span id="walk-progress"></span></button>
      <button type="button" data-view="map">文件地图</button>
      <button type="button" data-view="phases">六阶段</button>
      <button type="button" data-view="rules">硬规则</button>
      <button type="button" data-view="quiz">小测</button>
    </nav>
    <main id="stage"></main>
  </div>
  <footer>进度记在这台浏览器里。双击本文件即可打开。细则见 CLAUDE.md、docs/templates/templates.md、docs/templates/叙事路径.md、docs/templates/引擎语法手册.md。</footer>
</div>
<noscript>
  <p>脚本关闭时仍可记住主干：复制仓库后先做初始化清单，再按「定调 → 真相 → 谜面 → 机制 → 系统 → 结局」过阶段 1，然后骨架四轮审阅、文档自检、技术设计、垂直切片、校验试玩、发布。剧情放 story/，引擎用母本预置的 engine.js（零构建，双击 index.html 即玩）。</p>
</noscript>

      });
      CONCEPTS.forEach(function (c) {
        if ((c.title + c.sub).toLowerCase().indexOf(q) >= 0) hits.push({ hit: "go", id: c.id, title: c.title, sub: c.sub });
      });
      hits = hits.slice(0, 8);
      box.hidden = hits.length === 0;
      box.innerHTML = hits.map(function (h) {
        return "<button type='button' data-hit='" + h.hit + "' data-id='" + esc(h.id) + "'>" + esc(h.title) + "<small>" + esc(h.sub) + "</small></button>";
      }).join("");
    }
  });
  document.getElementById("path").addEventListener("change", function (e) { setPath(e.target.value); after(false); });
  document.getElementById("reset").addEventListener("click", function () {
    if (!window.confirm("清除这台浏览器里的说明页进度？")) return;
    localStorage.removeItem(KEY);
    S = fresh();
    document.getElementById("q").value = "";
    after(true);
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input, textarea, select")) return;
    if (S.view !== "walk") return;
    if (e.key === "ArrowRight") { document.querySelector("[data-act='next']") && document.querySelector("[data-act='next']").click(); }
    if (e.key === "ArrowLeft") { document.querySelector("[data-act='prev']") && document.querySelector("[data-act='prev']").click(); }
  });
  document.addEventListener("dragstart", function (e) {
    var role = e.target.closest("[data-role-id]");
    var ord = e.target.closest("[data-order-id]");
    if (role) e.dataTransfer.setData("text/plain", "role:" + role.dataset.roleId);
    else if (ord) e.dataTransfer.setData("text/plain", "order:" + ord.dataset.orderId);
  });
  document.addEventListener("dragover", function (e) {
    if (e.target.closest("[data-drop], [data-order-id]")) e.preventDefault();
  });
  document.addEventListener("drop", function (e) {
    var data = "";
    try { data = e.dataTransfer.getData("text/plain"); } catch (err) { return; }
    if (!data) return;
    if (data.indexOf("role:") === 0) {
      var zone = e.target.closest("[data-drop]");
      if (!zone) return;
      e.preventDefault();
      var id = data.slice(5);
      if (zone.dataset.drop === "pool") delete S.roles[id];
      else S.roles[id] = zone.dataset.drop;
      after(false);
    } else if (data.indexOf("order:") === 0) {
      var target = e.target.closest("[data-order-id]");
      if (!target) return;
      e.preventDefault();
      var fromId = data.slice(6);
      var toId = target.dataset.orderId;
      var a = S.order.slice();
      var from = a.indexOf(fromId);
      var to = a.indexOf(toId);
      if (from < 0 || to < 0 || from === to) return;
      a.splice(from, 1);
      a.splice(to, 0, fromId);
      S.order = a;
      after(false);
    }
  });
  render();
})();
</script>
</body>
</html>
